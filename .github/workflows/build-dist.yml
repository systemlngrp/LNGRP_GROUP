# Builds the site (dist/ and server-dist/) on GitHub and commits the result to main,
# because Hostinger serves the committed build files.
# Runs on every push to main that changes the app's source (src/, server/, public/, config),
# or by hand: GitHub -> Actions -> "Build dist" -> Run workflow. Its own commit only changes
# dist/ and server-dist/, so it does not trigger itself.
name: Build dist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dist.yml"
      - "src/**"
      - "server/**"
      - "public/**"
      - "scripts/build.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit build files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist server-dist
          if git diff --cached --quiet; then
            echo "Build files unchanged."
            exit 0
          fi
          git commit -m "Build dist and server-dist (GitHub Actions)"
          git pull --rebase origin main
          git push origin HEAD:main
